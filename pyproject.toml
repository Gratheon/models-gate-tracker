[tool.ruff]
target-version = "py38"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]

# deptry runs in CI without the project environment installed,
# so import names that differ from package names are mapped here.
[tool.deptry]
known_first_party = ["BeeModel", "BeeDataset"]
package_module_name_map = { opencv-python = "cv2", opencv-python-headless = "cv2", pillow = "PIL", pyyaml = "yaml", gratheon-log-lib = "gratheon_log_lib", pyserial = "serial", python-dotenv = "dotenv", tensorflow-datasets = "tensorflow_datasets", tensorflow-io = "tensorflow_io", requests-toolbelt = "requests_toolbelt" }

[tool.deptry.per_rule_ignores]
# grpcio and protobuf are version pins for tensorflow 2.11.
# TODO: onnx and tensorflow-io are not imported anywhere, candidates for removal.
DEP002 = ["grpcio", "protobuf", "onnx", "tensorflow-io"]
